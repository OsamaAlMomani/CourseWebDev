<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Small header -->
  <header class="header">
    <div class="container">
      <a href="#" class="logo">Shop</a>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart (0)</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="container">
      <h1>Featured Products</h1>
      <div class="grid">
        <div class="card">
          <div class="card-img">📦</div>
          <h3>Product One</h3>
          <p>$19.99</p>
          <button>Add to Cart</button>
        </div>
        <div class="card">
          <div class="card-img">🎧</div>
          <h3>Product Two</h3>
          <p>$29.99</p>
          <button>Add to Cart</button>
        </div>
        <div class="card">
          <div class="card-img">⌚</div>
          <h3>Product Three</h3>
          <p>$39.99</p>
          <button>Add to Cart</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Small footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Shop. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
