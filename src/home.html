<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Small header -->
     <header class="site-header">
    <a href="#" class="logo">Boox Store</a>

    <nav aria-label="Main navigation">
        <ul class="nav-links">
            <li><a href="#hero">Home</a></li>
            <li><a href="#shop">Books</a></li>
            <li><a href="#events">Events</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>
    </header>

  <!-- Main -->
   <!-- Main -->
  <main class="main">
    <div class="container">
      <h1>Featured Books</h1>
      <div class="grid">

        <div class="card">
          <div class="card-img">📕</div>
          <h3>The Midnight Library</h3>
          <p class="author">Matt Haig</p>
          <p class="price">$14.99</p>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <div class="card-img">📗</div>
          <h3>Atomic Habits</h3>
          <p class="author">James Clear</p>
          <p class="price">$18.50</p>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <div class="card-img">📘</div>
          <h3>The Hobbit</h3>
          <p class="author">J.R.R. Tolkien</p>
          <p class="price">$12.99</p>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <div class="card-img">📙</div>
          <h3>Educated</h3>
          <p class="author">Tara Westover</p>
          <p class="price">$16.75</p>
          <button>Add to Cart</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Small footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Boox Store. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
